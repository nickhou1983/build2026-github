<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub @ Microsoft Build 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --border:#30363d;
  --green:#39d353; --green-dim:#26a641; --green-deep:#0e4429;
  --text:#e6edf3; --muted:#8b949e;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#010409;overflow:hidden}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.stage{width:1920px;height:1080px;position:relative;transform-origin:center center;background:var(--bg);font-family:'JetBrains Mono','Noto Sans SC',monospace;overflow:hidden}
/* scanlines */
.stage::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);pointer-events:none;z-index:9}
/* contribution graph backdrop */
.graph{position:absolute;right:80px;top:120px;display:grid;grid-template-columns:repeat(20,26px);grid-auto-rows:26px;gap:7px;opacity:.9}
.graph i{border-radius:5px;background:#161b22;animation:pop .5s both}
.graph i.l1{background:#0e4429}.graph i.l2{background:#006d32}.graph i.l3{background:#26a641}.graph i.l4{background:#39d353}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.topbar{position:absolute;top:0;left:0;right:0;height:72px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 60px;gap:24px;background:var(--panel)}
.dot{width:16px;height:16px;border-radius:50%}
.d1{background:#ff5f56}.d2{background:#ffbd2e}.d3{background:#27c93f}
.path{color:var(--muted);font-size:22px;margin-left:20px}
.path b{color:var(--green)}
.content{position:absolute;left:100px;top:240px;width:1200px;z-index:5}
.prompt{color:var(--green);font-size:30px;margin-bottom:36px;animation:fade .8s .2s both}
.prompt .cmd{color:var(--text)}
h1{font-family:'Noto Sans SC',sans-serif;font-weight:900;font-size:108px;line-height:1.12;color:var(--text);animation:fade .8s .5s both}
h1 .hl{color:var(--green)}
h1 .en{font-family:'JetBrains Mono',monospace;font-weight:800;letter-spacing:-2px}
.sub{margin-top:44px;font-size:32px;color:var(--muted);font-family:'Noto Sans SC',sans-serif;animation:fade .8s .8s both}
.tags{margin-top:60px;display:flex;gap:20px;animation:fade .8s 1.1s both}
.tag{border:1px solid var(--green-dim);color:var(--green);font-size:22px;padding:12px 26px;border-radius:6px;background:rgba(57,211,83,.06)}
.cursor{display:inline-block;width:18px;height:34px;background:var(--green);vertical-align:-4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.foot{position:absolute;bottom:0;left:0;right:0;height:64px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 60px;color:var(--muted);font-size:20px;background:var(--panel)}
.foot .ok{color:var(--green)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="viewport"><div class="stage" id="stage">
  <div class="topbar">
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="path">~/github/<b>build2026</b> · main</span>
  </div>
  <div class="graph" id="graph"></div>
  <div class="content">
    <div class="prompt">$ <span class="cmd">gh build2026 --highlights --lang=zh</span></div>
    <h1><span class="en">GitHub</span> @ Microsoft<br><span class="en hl">Build 2026</span><br>核心发布亮点<span class="cursor"></span></h1>
    <div class="sub">Copilot App · Agentic 工作流 · 模型与平台 · 2026 年 7 月更新</div>
    <div class="tags">
      <span class="tag">copilot --cloud</span>
      <span class="tag">/fleet</span>
      <span class="tag">/chronicle</span>
      <span class="tag">agents</span>
    </div>
  </div>
  <div class="foot"><span><span class="ok">✓</span> 8 sections loaded</span><span>nickhou1983 · JUL 2026</span></div>
</div></div>
<script>
const g=document.getElementById('graph');
for(let i=0;i<140;i++){const e=document.createElement('i');const r=Math.random();
e.className=r>.82?'l4':r>.62?'l3':r>.42?'l2':r>.25?'l1':'';e.style.animationDelay=(i*8)+'ms';g.appendChild(e);}
function fit(){const s=document.getElementById('stage');const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`;}
fit();addEventListener('resize',fit);
</script>
</body>
</html>
